name: Refresh MLS NEXT data

# The feed host refuses both the sandbox this was written in and the laptop,
# so every pull happens here. Cron on GitHub is best effort -- roughly half of
# these slots actually fire -- which is why there are more of them than the
# data strictly needs.
on:
  workflow_dispatch:
  schedule:
    # match days: every 40 minutes through the afternoon and evening, US time
    - cron: "7,47 15-23 * * 0,6"
    - cron: "7,47 0-4 * * 0,1"
    # weekdays: results trickle in the morning after, so keep a slower beat
    - cron: "17 12-23/3 * * 1-5"

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Only while Netlify's deploy credits are out (Oct 2026). Delete the secret
  # and the git-triggered deploys take over again; the publish step skips.
  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
  NETLIFY_SITE_ID: fcc1a816-7991-4959-ab47-d4545ee16460

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull the feeds
        run: python3 tools/fetch.py

      - name: Reshape for the app
        run: python3 tools/transform.py

      - name: Mirror any new crests
        run: python3 tools/crests.py

      - name: Build the page
        run: python3 build.py

      # A refresh that finds nothing new must leave no commit behind, or the
      # repo fills with empty history and every push redeploys the site.
      - name: Commit anything that changed
        id: commit
        run: |
          git config user.name  "mlsnext-refresh"
          git config user.email "noreply@mlsnextscores.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "Refresh MLS NEXT data $(date -u '+%Y-%m-%d %H:%MZ')"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Netlify blocks git-triggered production deploys when the team is out of
      # credits, silently. A draft deploy still uploads and the API will publish
      # it, so do that from a clean worktree of what was just pushed (raw/ feeds
      # and other ignored files must not go out).
      - name: Publish to Netlify (credit-pause workaround)
        if: steps.commit.outputs.pushed == 'true'
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "No NETLIFY_AUTH_TOKEN -- leaving the deploy to Netlify."
            exit 0
          fi
          site="$RUNNER_TEMP/site"
          git worktree add --detach "$site" HEAD
          cd "$site"
          npx -y netlify-cli@27.14.1 deploy --dir=. --site="$NETLIFY_SITE_ID" \
            --message "Refresh $(git rev-parse --short HEAD) (draft, published by CI)" \
            --json > "$RUNNER_TEMP/draft.json"
          id=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['deploy_id'])" "$RUNNER_TEMP/draft.json")
          npx -y netlify-cli@27.14.1 api restoreSiteDeploy \
            --data "{\"site_id\":\"$NETLIFY_SITE_ID\",\"deploy_id\":\"$id\"}" > /dev/null
          # A publish that didn't take reads as success otherwise -- compare the
          # live page's build stamp against the one just deployed.
          want=$(grep -o '"updated":"[^"]*"' index.html | head -1)
          live=$(curl -s "https://mlsnextscores.netlify.app/?v=$id" | grep -o '"updated":"[^"]*"' | head -1)
          echo "deployed $id  want $want  live $live"
          [ "$want" = "$live" ] || { echo "::error::Live page did not update"; exit 1; }

      # The pull runs unattended, so a failure has to leave a note in the repo
      # rather than only in a log nobody opens.
      - name: Leave a note if this run failed
        if: failure()
        run: |
          mkdir -p probe
          {
            echo "# Refresh failed"
            echo
            echo "- when: $(date -u '+%Y-%m-%d %H:%M:%SZ')"
            echo "- run:  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > probe/last_failure.md
          git config user.name  "mlsnext-refresh"
          git config user.email "noreply@mlsnextscores.com"
          git add probe/last_failure.md
          git commit -m "Refresh failed $(date -u '+%Y-%m-%d %H:%MZ')" || true
          git push || true
